{% extends "base.html" %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
  <div class="w-full max-w-sm bg-[#FFFDF8] border border-[#E7DFCC] rounded-xl shadow-sm p-6">
    <div class="text-[10px] tracking-[0.2em] uppercase text-[#C69A3E] mb-1">Kitchen Ledger</div>
    <h1 class="text-xl font-semibold font-display text-[#1E4536] mb-4">Sign in</h1>
    {% if form.errors %}
      <div class="text-sm bg-rose-50 text-rose-700 border border-rose-200 rounded-md px-3 py-2 mb-3">Incorrect username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label class="block mb-3">
        <span class="block text-xs font-medium text-stone-600 mb-1">Username</span>
        <input type="text" name="username" required autofocus class="w-full rounded-md border border-[#D9CFB4] bg-white px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#1E4536]/30 focus:border-[#1E4536]">
      </label>
      <label class="block mb-4">
        <span class="block text-xs font-medium text-stone-600 mb-1">Password</span>
        <input type="password" name="password" required class="w-full rounded-md border border-[#D9CFB4] bg-white px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#1E4536]/30 focus:border-[#1E4536]">
      </label>
      <button type="submit" class="w-full bg-[#1E4536] text-white rounded-md py-2 text-sm font-medium hover:bg-[#16332A]">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
