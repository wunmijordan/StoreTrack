<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ biz.name|default:"Stock Ledger" }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', sans-serif; background:#FAF6EF; color:#211D1A; }
    .font-display { font-family: 'Fraunces', serif; }
    .font-mono { font-family: 'IBM Plex Mono', monospace; }
    table { font-variant-numeric: tabular-nums; }
    [x-cloak] { display: none !important; }
    @media (min-width: 1024px) {
      .desktop-sidebar { position: fixed; inset: 0 auto 0 0; width: 14rem; height: 100vh; overflow-y: auto; scrollbar-width: none; z-index: 50; }
      .desktop-sidebar::-webkit-scrollbar { width: 0; height: 0; }
      .desktop-main { margin-left: 14rem; min-height: 100vh; }
    }
  </style>
</head>
<body>
<div class="min-h-[80vh] flex items-center justify-center mt-6">
  <div class="w-full max-w-sm bg-[#FFFDF8] border border-[#E7DFCC] rounded-xl shadow-[0_2px_8px_#000000d2] p-6">
    <div class="font-semibold mt-1 font-display">{{ biz.name }}</div>
    <div class="text-[10px] tracking-[0.2em] uppercase text-[#C69A3E] mb-1">Stock Ledger</div>
    <h1 class="text-xl font-semibold font-display text-[#8f172d] mb-4">Sign In</h1>
    {% if form.errors %}
      <div class="text-sm bg-rose-50 text-rose-700 border border-rose-200 rounded-md px-3 py-2 mb-3">Incorrect username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label class="block mb-3">
        <span class="block text-xs font-medium text-stone-600 mb-1">Username</span>
        <input type="text" name="username" required autofocus class="w-full rounded-md border border-[#D9CFB4] bg-white px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#8f172d]/30 focus:border-[#8f172d] shadow-[inset_0_2px_4px_#000000d2]">
      </label>
      <label class="block mb-4">
        <span class="block text-xs font-medium text-stone-600 mb-1">Password</span>
        <input type="password" name="password" required class="w-full rounded-md border border-[#D9CFB4] bg-white px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#8f172d]/30 focus:border-[#8f172d] shadow-[inset_0_-2px_4px_#000000d2]">
      </label>
      <button type="submit" class="w-full bg-[#8f172d] text-white rounded-md py-2 text-sm font-medium hover:bg-[#4D1C25] shadow-[0_-2px_4px_#000000d2]">Sign In</button>
    </form>
  </div>
</div>
</body>
</html>
