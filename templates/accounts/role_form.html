{% extends "base.html" %}
{% block content %}
<h2 class="text-xl font-semibold font-display text-[#8f172d] mb-4">{% if obj %}Edit role{% else %}Create role{% endif %}</h2>
<div class="max-w-xl bg-[#FFFDF8] border border-[#E7DFCC] rounded-lg p-5"><form method="post">{% csrf_token %}{% for field in form %}<label class="block mb-4"><span class="block text-xs font-medium text-stone-600 mb-1">{{ field.label }}</span>{{ field }}{% if field.errors %}<span class="text-xs text-rose-600">{{ field.errors|striptags }}</span>{% endif %}</label>{% endfor %}<div class="flex justify-end gap-2"><a href="{% url 'roles_list' %}" class="px-3 py-2 text-sm text-stone-500">Cancel</a><button class="px-4 py-2 rounded-md bg-[#8f172d] text-white text-sm">Save role</button></div></form></div>
{% endblock %}
