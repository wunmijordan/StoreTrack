<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#FAF6EF]"><main class="max-w-lg mx-auto p-6 mt-12 bg-white rounded-xl border"><h1 class="text-xl font-semibold">Order request received</h1><p class="mt-2 text-sm text-stone-600">Reference <strong>{{ intake.public_number }}</strong>. {{ store_business.name }} will review the request before stock, production or finance is changed.</p><a href="{% url 'storefront_order_status' store_business.slug intake.public_id %}" class="inline-block mt-3 underline">Check order status</a>{% if intake.status == "awaiting_preorder" %}<form method="post" action="{% url 'storefront_switch_preorder' store_business.slug intake.public_id %}" class="mt-4">{% csrf_token %}<button class="rounded px-4 py-2 text-white" style="background:{{ store_business.accent_color }}">Switch this request to Pre-order</button></form>{% endif %}<a href="{% url 'storefront' store_business.slug %}" class="inline-block mt-4 underline">Back to storefront</a></main></body></html>
